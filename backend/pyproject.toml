[project]
name = "cognitive-monitoring-backend"
version = "0.1.0"
description = "FastAPI backend for the COGNUANCE cognitive monitoring prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg[binary]>=3,<4",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.9",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["data", "artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]  # test-only secrets; seeded RNG for deterministic fixtures
"app/services/readiness.py" = ["S608"]  # constant integer in SET LOCAL, not user input
"alembic/versions/**" = ["E501"]  # autogenerated constraint names

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
